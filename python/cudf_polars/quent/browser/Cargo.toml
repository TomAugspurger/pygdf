[package]
name = "cudf-polars-quent-browser"
version = "0.1.0"
edition = "2024"
publish = false

[features]
generate = [
    "cudf-polars-quent-store/filesystem",
    "dep:quent-store",
    "dep:tempfile",
    "dep:zip",
]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cudf-polars-quent-bundle"
path = "src/bin/generate.rs"
required-features = ["generate"]

[dependencies]
async-trait = "0.1"
cudf-polars-quent-analyzer = { path = "../analyzer", default-features = false }
cudf-polars-quent-store = { path = "../store", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
quent-analyzer = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-events = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", features = ["serde"] }
quent-query-engine-analyzer = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-query-engine-ui = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-store = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", default-features = false, features = ["io-ndjson"], optional = true }
quent-ui = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
thiserror = "2"
uuid = { version = "1", features = ["serde", "js"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
zip = { version = "6", default-features = false, features = ["deflate"], optional = true }
