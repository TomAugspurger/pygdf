[workspace]

[package]
name = "cudf-polars-quent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_quent"
crate-type = ["cdylib"]

[features]
default = ["collector"]
collector = ["quent-instrumentation/io-collector", "quent-io/collector"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
quent-collector = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1" }
quent-collector-proto = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1" }
quent-dynamic-attributes = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1" }
quent-instrumentation = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1", features = ["serde", "io-ndjson"] }
quent-io = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1", default-features = false, features = ["ndjson"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"

[build-dependencies]
quent-build-info = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1" }
quent-instrumentation-build = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1" }
quent-schema-codegen-python = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1" }
quent-yaml = { git = "https://github.com/rapidsai/quent", rev = "b21933d06dbb0c46339ded31d0fdaacae03cc3b1" }
