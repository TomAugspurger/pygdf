[workspace]

[package]
name = "cudf-polars-quent"
# rapids-pre-commit-hooks: disable-next-line
version = "27.2.0"
edition = "2024"
publish = false

[lib]
name = "cudf_polars_quent"
crate-type = ["cdylib"]

[features]
default = ["collector"]
collector = []

[dependencies]
cudf-polars-quent-browser = { path = "../browser", features = ["generate"] }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
quent-collector-python = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-dynamic-attributes = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-instrumentation = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", features = ["serde", "io-ndjson", "io-collector"] }
quent-io = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", default-features = false, features = ["ndjson", "collector"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
quent-build-info = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-instrumentation-build = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-schema-codegen-python = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-yaml = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
