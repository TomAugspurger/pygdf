[package]
name = "cudf-polars-quent-store"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["filesystem"]
filesystem = ["quent-store/io-ndjson"]

[dependencies]
quent-analyzer = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-events = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", features = ["serde"] }
quent-store = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
smallvec = "1"

[build-dependencies]
quent-store-build = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-yaml = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
