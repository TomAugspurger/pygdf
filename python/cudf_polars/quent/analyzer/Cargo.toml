[package]
name = "cudf-polars-quent-analyzer"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["filesystem"]
filesystem = [
    "dep:quent-io",
    "dep:quent-store",
    "cudf-polars-quent-store/filesystem",
]

# quent-open's generated viewer pins quent to the sidecar's remote and full
# commit SHA. Cargo keys git sources on the rev spelling, so an abbreviated rev
# here would build a second copy of these crates and the two `QuentViewer`
# traits would not unify.
[dependencies]
cudf-polars-quent-store = { path = "../store", default-features = false }
quent-analyzer = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-dynamic-attributes = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-events = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", features = ["serde"] }
quent-io = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", default-features = false, optional = true }
quent-query-engine-analyzer = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-query-engine-ui = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-store = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a", default-features = false, features = ["io-ndjson"], optional = true }
quent-time = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
quent-ui = { git = "https://github.com/rapidsai/quent", rev = "8551f90c648b25508061f941a6fc43046f739d7a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
