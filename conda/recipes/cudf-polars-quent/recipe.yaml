schema_version: 1

context:
  version: ${{ env.get("RAPIDS_PACKAGE_VERSION") }}
  datetime_string: ${{ env.get("RAPIDS_DATETIME_STRING") }}
  head_rev: ${{ git.head_rev(".")[:8] }}
  py_abi_min: ${{ env.get("RAPIDS_PY_VERSION") }}
  py_buildstring: ${{ py_abi_min | version_to_buildstring }}

package:
  name: cudf-polars-quent
  version: ${{ version }}

source:
  path: ../../..

# This package is compiled Rust (PyO3, abi3) and has no CUDA dependency, so unlike
# pylibcudf/cudf-streaming the build string has no CUDA component.
build:
  python:
    version_independent: true
  string: cp${{ py_buildstring }}_abi3_${{ datetime_string }}_${{ head_rev }}
  script:
    content: |
      cd python/cudf_polars/quent/bridge
      # Keep the installed distribution metadata consistent with the conda package version.
      sed -i "s/^version = .*/version = \"${RAPIDS_PACKAGE_VERSION}\"/" pyproject.toml
      python -m pip install . -vv --no-deps --no-build-isolation
    env:
      # Match the lockfile enforcement used by ci/run_cudf_polars_quent_tests.sh.
      MATURIN_PEP517_ARGS: --locked
      RAPIDS_PACKAGE_VERSION: ${{ version }}

requirements:
  build:
    # Keep the rust and maturin pins in sync with `build_cudf_polars_quent` in dependencies.yaml.
    - rust =1.97
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
  host:
    - maturin >=1.14,<2
    - pip
    - python =${{ py_abi_min }}
    - python-abi3 ${{ py_abi_min }}.*
  run:
    - python

about:
  homepage: ${{ load_from_file("python/cudf_polars/quent/bridge/pyproject.toml").project.urls.Homepage }}
  license: ${{ load_from_file("python/cudf_polars/quent/bridge/pyproject.toml").project.license }}
  summary: ${{ load_from_file("python/cudf_polars/quent/bridge/pyproject.toml").project.description }}
